name: Scanner Daily Discount Email

on:
  schedule:
    # 7:00 in Stockholm: 05:00 UTC in summer time, 06:00 UTC in winter time. The route only
    # acts on the run that lands at 7:xx.
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  trigger:
    name: Trigger daily check endpoint
    runs-on: ubuntu-latest
    steps:
      # Fails on anything but a 2xx. `curl -f` alone lets a redirect through as success, so a
      # SCANNER_URL that redirects (http://, or a domain Vercel forwards) never reached the route.
      - name: Call daily check cron
        run: |
          status=$(curl -sS -o response.txt -w '%{http_code}' -X GET --max-time 320 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SCANNER_URL }}/api/cron/daily-check${{ github.event_name == 'workflow_dispatch' && '?force=1' || '' }}")
          echo "HTTP $status"
          cat response.txt; echo
          case "$status" in
            2??) ;;
            3??) echo "::error::SCANNER_URL redirects: set it to the final https:// address"; exit 1 ;;
            *) exit 1 ;;
          esac
